name: E2E-Testing
on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
      baseUrl:
        description: 'Base URL'
        required: true

jobs:
  karateTesting:
    name: Run the karate tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: adopt
      - name: Build project
        run: mvn clean install -DskipTests
      - name: Run Karate tests
        run: |
          echo "Environment: ${{ github.event.inputs.env }}"
          echo "Base URL: ${{ github.event.inputs.baseUrl }}"
          mvn clean test -Dtest=customJava/JavaRunner -Dkarate.env=${{ github.event.inputs.env }} -Dkarate.baseUrl=${{ github.event.inputs.baseUrl }}